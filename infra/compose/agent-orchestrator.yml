services:
  agent-orchestrator:
    build:
      context: ../../services/agent-orchestrator
      dockerfile: Dockerfile
    container_name: index0-agent-orchestrator
    restart: unless-stopped
    environment:
      - PORT=8000
      - ORCHESTRATOR_ENVIRONMENT=production
      - ORCHESTRATOR_DEBUG=false
      - ORCHESTRATOR_SANDBOX_MANAGER_URL=http://sandbox-manager:3002
      - ORCHESTRATOR_LITELLM_PROXY_URL=http://litellm:4000
      - ORCHESTRATOR_OPENHANDS_URL=http://openhands:3000
      - ORCHESTRATOR_MAX_REVIEW_ITERATIONS=5
      - ORCHESTRATOR_ARCHITECT_MODEL=${ORCHESTRATOR_ARCHITECT_MODEL:-claude-3-7-sonnet}
      - ORCHESTRATOR_DEVELOPER_MODEL=${ORCHESTRATOR_DEVELOPER_MODEL:-claude-3-5-sonnet}
      - ORCHESTRATOR_CRITIC_MODEL=${ORCHESTRATOR_CRITIC_MODEL:-claude-3-5-sonnet}
      - ORCHESTRATOR_QA_MODEL=${ORCHESTRATOR_QA_MODEL:-claude-3-5-haiku}
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - index0-net
