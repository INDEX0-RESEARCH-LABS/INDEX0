services:
  tabby:
    image: tabbyml/tabby:0.18.0
    container_name: index0-tabby
    entrypoint: /opt/tabby/bin/tabby-cpu
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TABBY_LOG_LEVEL=info
    volumes:
      - tabby_data:/data
      - ../tabby/config.toml:/data/config.toml:ro
    command: serve --device cpu
    healthcheck:
      # Tabby /v1/health returns 401 (auth required) when running — 401 is proof-of-life.
      # We accept HTTP 200 OR 401; only connection refused / 5xx = unhealthy.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health | grep -qE '^(200|401)$'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - index0-net

volumes:
  tabby_data:
    driver: local

networks:
  index0-net:
    name: index0-net
    driver: bridge
