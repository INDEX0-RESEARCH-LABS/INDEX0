# INDEX0 Sovereign IDE — code-server Cloud Compose Override
# Adds cloud IDE instances to the sovereign infrastructure stack.
#
# Usage: docker compose -f infra/compose/docker-compose.yml -f infra/compose/code-server.yml up -d

services:
  code-server:
    build:
      context: ../..
      dockerfile: infra/code-server/Dockerfile
    container_name: index0-code-server
    restart: unless-stopped
    environment:
      - DEFAULT_WORKSPACE=/workspace
      - VSCODE_TELEMETRY_DISABLED=1
      # Connect to sovereign infrastructure
      - INDEX0_GATEWAY_URL=http://gateway:8000
      - INDEX0_LITELLM_URL=http://litellm:4000/v1
      - INDEX0_TABBY_URL=http://tabby:8080
      - INDEX0_LIVEKIT_URL=ws://livekit:7880
    ports:
      - "8443:8443"
    volumes:
      - ../../workspace:/workspace
    depends_on:
      - gateway
    networks:
      - index0-net
