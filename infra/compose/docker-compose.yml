name: index0-stack

networks:
  index0-net:
    name: index0-net
    driver: bridge

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: index0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-index0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-index0_secret}
      POSTGRES_DB: ${POSTGRES_DB:-index0_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-index0} -d ${POSTGRES_DB:-index0_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - index0-net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: index0-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-index0_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - index0-net

  openmeter:
    image: ghcr.io/openmeterio/openmeter:latest
    container_name: index0-openmeter
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ../openmeter/config.yaml:/etc/openmeter/config.yaml:ro
    networks:
      - index0-net

  lago:
    image: getlago/api:v1.12.0
    container_name: index0-lago
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAGO_DATABASE_URL: postgresql://${POSTGRES_USER:-index0}:${POSTGRES_PASSWORD:-index0_secret}@postgres:5432/${POSTGRES_DB:-index0_dev}?sslmode=disable
      PORT: 3000
      RAILS_ENV: production
      LAGO_API_URL: http://localhost:3001
      LAGO_FRONT_URL: http://localhost:3001
      SECRET_KEY_BASE: ${LAGO_SECRET_KEY_BASE:-placeholder_lago_secret_key_base_for_dev_mode_only_1234567890}
      RSA_PRIVATE_KEY: ${LAGO_RSA_PRIVATE_KEY:-placeholder_rsa_private_key}
    ports:
      - "3001:3000"
    volumes:
      - ../lago/plans.json:/etc/lago/plans.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - index0-net

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: index0-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-index0}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-index0_secret}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    networks:
      - index0-net

  temporal-ui:
    image: temporalio/ui:2.27.0
    container_name: index0-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8233"
    networks:
      - index0-net

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.54.0
    container_name: index0-zitadel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-from-init --config /zitadel/init-config.yaml --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32BytesLen!}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB:-index0_dev}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-index0}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD:-index0_secret}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:-false}"
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8000}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_FIRSTINSTANCE_ORG_NAME:-Acme Software Labs}
    ports:
      - "8085:8085"
    volumes:
      - ../zitadel/init-config.yaml:/zitadel/init-config.yaml:ro
    networks:
      - index0-net

  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.18
    container_name: index0-openhands
    restart: unless-stopped
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.all-hands.dev/all-hands-ai/runtime:0.18-nikolaik
      - LOG_ALL_EVENTS=true
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-3-5-sonnet-20241022}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - WORKSPACE_BASE=/opt/workspace_base
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_MOUNT_PATH:-}
      - FILE_STORE=${FILE_STORE:-local}
      - FILE_STORE_PATH=${FILE_STORE_PATH:-/opt/workspace_base/.openhands-state}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../workspace:/opt/workspace_base
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - index0-net

  gateway:
    image: caddy:2-alpine
    container_name: index0-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - zitadel
      - openhands
    networks:
      - index0-net
