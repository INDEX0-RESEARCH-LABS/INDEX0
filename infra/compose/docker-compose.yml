name: index0-stack

networks:
  index0-net:
    name: index0-net
    driver: bridge

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: index0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-index0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-index0_secret}
      POSTGRES_DB: ${POSTGRES_DB:-index0_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-index0} -d ${POSTGRES_DB:-index0_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - index0-net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: index0-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-index0_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - index0-net

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: index0-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-index0}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-index0_secret}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    networks:
      - index0-net

  temporal-ui:
    image: temporalio/ui:2.27.0
    container_name: index0-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8233"
    networks:
      - index0-net

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.54.0
    container_name: index0-zitadel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32BytesLen!}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${POSTGRES_DB:-index0_dev}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${POSTGRES_USER:-index0}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD:-index0_secret}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: 8085
      ZITADEL_EXTERNALDOMAIN: localhost
    ports:
      - "8085:8085"
    networks:
      - index0-net
