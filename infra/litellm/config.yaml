model_list:
  # Primary Architect & Coding Model (Azure OpenAI - Consumes Azure Credits)
  - model_name: "azure-gpt-4o"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"
    model_info:
      max_tokens: 128000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  # High-Speed QA & Critic Model (Azure OpenAI - Consumes Azure Credits)
  - model_name: "azure-gpt-4o-mini"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"
    model_info:
      max_tokens: 128000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  # Map standard alias names to Azure deployments
  - model_name: "gpt-4o"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  # Fallback mappings to guarantee zero third-party bills
  - model_name: "claude-3-5-sonnet"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  - model_name: "claude-sonnet-4"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  - model_name: "claude-3-5-haiku"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  - model_name: "claude-3-7-sonnet"
    litellm_params:
      model: "azure/azure-gpt-4o"
      api_base: "https://oai-index0-prod-eastus-426dd.openai.azure.com/"
      api_version: "2024-08-01-preview"
      api_key: "os.environ/AZURE_OPENAI_API_KEY"

  # ---------------------------------------------------------------------------
  # Zero-cost routes. Pick one with DEMO_MODEL in demo/run-demo.sh.
  # Each needs only its own key; no Azure subscription required.
  # ---------------------------------------------------------------------------

  # Groq free tier — no credit card, fastest option (~300 tok/s, Llama 3.3 70B).
  - model_name: "groq"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "os.environ/GROQ_API_KEY"
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Google AI Studio free tier — no credit card.
  - model_name: "gemini"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "os.environ/GEMINI_API_KEY"
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

  # OpenRouter free models — no credit card, rate-limited.
  - model_name: "openrouter"
    litellm_params:
      model: "openrouter/meta-llama/llama-3.3-70b-instruct:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  drop_params: true

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 3
  timeout: 60
  fallbacks:
    - "azure-gpt-4o-mini": ["azure-gpt-4o"]
    - "azure-gpt-4o": ["azure-gpt-4o"]
    - "gpt-4o": ["azure-gpt-4o"]
    - "gpt-4o-mini": ["azure-gpt-4o"]

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
