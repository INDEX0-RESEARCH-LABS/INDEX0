# OpenMeter Sovereign Telemetry & Metering Configuration for INDEX0 AI
# Sinks directly into ClickHouse index0_analytics database

address: ":8888"

events:
  broker: "kafka:9092"

ingest:
  kafka:
    broker: "kafka:9092"

telemetry:
  address: ":10000"

aggregation:
  clickhouse:
    address: "clickhouse:9000"
    database: "index0_analytics"
    username: "default"
    password: ""

meters:
  - slug: "tokens_total"
    description: "Total tokens consumed across agent runs and prompt completions"
    aggregation: "SUM"
    eventType: "tokens.total"
    valueProperty: "$.value"
    groupBy:
      tenant_id: "$.tenant_id"
      model: "$.model"

  - slug: "tokens_prompt"
    description: "Prompt input tokens consumed by LLM invocations"
    aggregation: "SUM"
    eventType: "tokens.prompt"
    valueProperty: "$.value"
    groupBy:
      tenant_id: "$.tenant_id"
      model: "$.model"

  - slug: "tokens_completion"
    description: "Completion output tokens generated by LLM models"
    aggregation: "SUM"
    eventType: "tokens.completion"
    valueProperty: "$.value"
    groupBy:
      tenant_id: "$.tenant_id"
      model: "$.model"

  - slug: "sandbox_duration_ms"
    description: "Sandbox execution time in milliseconds across languages"
    aggregation: "SUM"
    eventType: "sandbox.duration_ms"
    valueProperty: "$.value"
    groupBy:
      tenant_id: "$.tenant_id"
      language: "$.language"

  - slug: "agent_run_count"
    description: "Total count of autonomous agent runs dispatched"
    aggregation: "COUNT"
    eventType: "agent.run_count"
    groupBy:
      tenant_id: "$.tenant_id"
      status: "$.status"
