[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "index0-voice-agent"
version = "0.1.0"
description = "Sub-100ms Multimodal WebRTC Voice & Pipecat Agent for INDEX0 AGI"
authors = [{ name = "INDEX0 Research Labs" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "livekit-api>=0.5.0",
    "livekit-agents>=0.8.0",
    "pipecat-ai>=0.0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
