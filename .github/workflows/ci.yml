name: CI Quality Gate & Conformance

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'integration/**'
      - 'feat/**'
      - 'feature/**'

jobs:
  monorepo:
    name: Monorepo Build, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build All Packages
        run: pnpm build

      - name: Typecheck All Packages
        run: pnpm typecheck

      - name: Run Package Tests
        run: pnpm test

  contracts:
    name: Contracts Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Install Contracts Dependencies
        working-directory: packages/contracts
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Compile Contracts & Check Types
        working-directory: packages/contracts
        run: |
          pnpm run build
          pnpm run typecheck

  infrastructure:
    name: Infrastructure Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f infra/compose/docker-compose.yml config

  python-services:
    name: Python Service Tests (Orchestrator, Voice)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Create venv and install editable services
        run: |
          uv venv --python 3.12
          uv pip install -e "./services/agent-orchestrator[dev]" -e "./services/voice-agent[dev]"

      - name: Agent orchestrator tests
        working-directory: services/agent-orchestrator
        run: ../../.venv/bin/python -m pytest tests -q

      - name: Voice agent tests
        working-directory: services/voice-agent
        run: ../../.venv/bin/python -m pytest tests -q

  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Diff for Committed Secrets
        run: |
          set -euo pipefail
          echo "Scanning for accidental secret leaks..."
          # Capture the diff first so a git error fails the job instead of
          # silently reading as "clean". grep -E has no lookahead: match
          # assignments, then drop known placeholders and files under *.example.
          diff=$(git diff origin/main)
          matches=$(printf '%s\n' "$diff" \
            | grep -iE '^\+.*(SECRET_KEY|API_KEY|PRIVATE_KEY|TOKEN)=' \
            | grep -viE 'YOUR_|placeholder|Masterkey|\.example|_KEY=$|_KEY=""' || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Unsanitized credentials detected in git diff!"
            echo "$matches" | sed -E 's/=.*/=<redacted>/'
            exit 1
          fi
          echo "No exposed credentials detected. Repository clean."

      - name: License Boundary Audit
        run: bash scripts/license-check.sh

  license-compliance:
    name: License Boundary & AGPL Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run License Audit
        run: bash scripts/license-check.sh
